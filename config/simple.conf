server {
    listen 80;
    listen 443 ssl http2;

    server_name www.podsalt-prime.com podsalt-prime.com;
    charset utf-8;

    ssl_certificate /root/.acme.sh/podsalt-prime.com_ecc/fullchain.cer;
    ssl_certificate_key /root/.acme.sh/podsalt-prime.com_ecc/podsalt-prime.com.key;

    client_max_body_size 200M;

    error_page 404 /;
    error_page 403 /;

    root /x/podsalt/app/dist;

    location /public {
        alias /x/podsalt/app/public;
    }
}
